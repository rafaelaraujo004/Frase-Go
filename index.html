<body>
<!-- Modal de Login -->
<div id="modalLogin" class="modal-overlay">
<form id="formLogin" class="modal-form" role="dialog" aria-labelledby="loginTitle" aria-describedby="loginDesc">
<h2 id="loginTitle">Entrar</h2>
<p id="loginDesc" class="sr-only">Faça login para acessar recursos exclusivos</p>
<input id="loginEmail" type="email" placeholder="E-mail" required aria-label="E-mail">
<input id="loginSenha" type="password" placeholder="Senha" required aria-label="Senha">
<button type="submit">Entrar</button>
<button type="button" id="btnGoogle" class="google-login-btn" aria-label="Entrar com Google">
<img src="https://www.svgrepo.com/show/475656/google-color.svg" alt=""> Entrar com Google
</button>
<div class="modal-buttons-row">
<button type="button" id="btnCriarConta" class="modal-text-btn">Criar conta</button>
<button type="button" id="btnEsqueciSenha" class="modal-text-btn danger">Esqueci a senha</button>
</div>
<button type="button" id="btnConvidado" class="guest-login-btn" aria-label="Continuar como convidado">
Continuar como convidado
</button>
<div id="loginErro" class="modal-error" role="alert"></div>
</form>
</div>
<!-- Modal de cadastro -->
<div id="modalCadastro" class="modal-overlay">
<form id="formCadastro" class="modal-form" role="dialog" aria-labelledby="cadastroTitle" aria-describedby="cadastroDesc">
<h2 id="cadastroTitle">Criar Conta</h2>
<p id="cadastroDesc" class="sr-only">Crie sua conta para salvar favoritos e acessar recursos exclusivos</p>
<input id="cadastroEmail" type="email" placeholder="E-mail" required aria-label="E-mail">
<input id="cadastroSenha" type="password" placeholder="Senha" required aria-label="Senha" minlength="6">
<button type="submit">Cadastrar</button>
<button type="button" id="btnVoltarLogin" class="modal-text-btn">Voltar ao login</button>
<div id="cadastroErro" class="modal-error" role="alert"></div>
</form>
</div>
<!-- Modal de esqueci senha -->
<div id="modalEsqueciSenha" class="modal-overlay">
<form id="formEsqueciSenha" class="modal-form" role="dialog" aria-labelledby="esqueciTitle" aria-describedby="esqueciDesc">
<h2 id="esqueciTitle">Recuperar Senha</h2>
<p id="esqueciDesc" class="sr-only">Digite seu e-mail para receber o link de recuperação</p>
<input id="esqueciEmail" type="email" placeholder="E-mail cadastrado" required aria-label="E-mail cadastrado">
<button type="submit">Enviar link de recuperação</button>
<button type="button" id="btnVoltarLogin2" class="modal-text-btn">Voltar ao login</button>
<div id="esqueciErro" class="modal-error" role="alert"></div>
<div id="esqueciSucesso" class="modal-success" role="status"></div>
</form>
</div>
